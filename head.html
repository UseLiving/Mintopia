<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;--bg:#150b3a;--bg2:#1f1250;--bg3:#2c1a6c;--line:#4a2fb0;--ink:#0b0620;--text:#fff6e3;--mute:#cdbeff;--gold:#ffc83d;--gold2:#ff9a2f;--teal:#25d9b5;--pink:#ff4f9a;--blue:#2f5fe0;--bad:#ff6b8a;--ser:'Baloo 2','Arial Rounded MT Bold','DejaVu Sans',Arial,sans-serif;--sans:Nunito,'DejaVu Sans',Arial,sans-serif;--pw:420px;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;height:100%;background:linear-gradient(#150b3a,#2c1a8a 55%,#3a22a6);color:var(--text);font-family:var(--sans);font-weight:600;overflow:hidden;-webkit-tap-highlight-color:transparent}
body{display:flex}button,input{font:inherit}
#sky{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0}
#stage{z-index:1;position:fixed;left:0;top:0;right:var(--pw);bottom:0;width:calc(100% - var(--pw));height:100%;display:block;touch-action:none;cursor:pointer;outline:none}
#stage:focus-visible{box-shadow:inset 0 0 0 4px var(--gold)}
.hud{position:fixed;top:0;left:0;right:var(--pw);padding:10px 14px;display:flex;gap:12px;align-items:flex-start;pointer-events:none;z-index:5}
.hud>*{pointer-events:auto}
.logo{display:flex;align-items:center;gap:8px;font-family:var(--ser);font-weight:800;font-size:22px;color:var(--gold);text-shadow:0 3px 0 var(--ink);white-space:nowrap}
.logo svg.lm{width:48px;height:50px;flex:none;filter:drop-shadow(0 3px 5px rgba(11,6,32,.55))}.logo svg.lw{height:34px;width:auto;flex:none;filter:drop-shadow(0 3px 5px rgba(11,6,32,.55))}
.bank{flex:1;text-align:center;min-width:0}
.coins{font-family:var(--ser);font-weight:800;font-size:clamp(34px,5.6vw,56px);line-height:1;color:var(--gold);text-shadow:0 4px 0 var(--ink),0 0 24px rgba(255,200,61,.45);letter-spacing:-1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.coinname{font-family:var(--ser);font-weight:800;font-size:18px;color:var(--text);text-shadow:0 2px 0 var(--ink)}
.ps{font-size:15px;color:var(--mute);text-shadow:0 2px 0 var(--ink)}
.tier{height:12px;max-width:340px;margin:6px auto 0;border:3px solid var(--ink);border-radius:999px;background:rgba(11,6,32,.7);overflow:hidden}
.tier i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--pink))}
.tiernote{font-size:12px;color:var(--mute);text-shadow:0 2px 0 var(--ink);margin-top:2px}
.tools{display:flex;gap:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:8px 14px;border:3px solid var(--ink);border-radius:14px;background:var(--gold);color:var(--ink);font-family:var(--ser);font-weight:800;font-size:16px;cursor:pointer;box-shadow:0 4px 0 var(--ink);transition:transform .1s,box-shadow .1s,filter .1s;user-select:none;text-align:center;line-height:1.1}
.btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 6px 0 var(--ink)}.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn:disabled{filter:grayscale(.85) brightness(.7);cursor:not-allowed;box-shadow:0 2px 0 var(--ink)}
.btn.teal{background:var(--teal)}.btn.pink{background:var(--pink)}.btn.blue{background:var(--blue);color:#fff}.btn.ghost{background:var(--bg3);color:var(--text)}.btn.sm{min-height:36px;padding:4px 10px;font-size:14px}.btn.on{outline:3px solid var(--text)}
.btn:focus-visible,#stage:focus-visible,.tab:focus-visible,input:focus-visible{outline:3px solid #fff;outline-offset:2px}
.panel{position:fixed;top:0;right:0;bottom:0;width:var(--pw);background:var(--bg2);border-left:4px solid var(--ink);display:flex;flex-direction:column;z-index:6;box-shadow:-8px 0 0 rgba(11,6,32,.35)}
.tabs{display:flex;gap:4px;padding:8px 8px 0;background:var(--bg);border-bottom:4px solid var(--ink)}
.tab{flex:1 1 0;min-width:0;min-height:44px;padding:0 2px;border:3px solid var(--ink);border-bottom:0;border-radius:12px 12px 0 0;background:var(--bg3);color:var(--mute);font-family:var(--ser);font-weight:800;font-size:clamp(10px,3.1vw,13.5px);cursor:pointer;position:relative;overflow:hidden}
.tab[aria-selected=true]{background:var(--gold);color:var(--ink)}
.tab .dot{position:absolute;top:2px;right:4px;width:12px;height:12px;border-radius:50%;background:var(--pink);border:2px solid var(--ink);display:none}.tab .dot.show{display:block}
.view{flex:1;overflow-y:auto;padding:10px;scrollbar-width:thin}
.buyq{display:flex;gap:6px;margin-bottom:10px;align-items:center;flex-wrap:wrap}.buyq b{font-family:var(--ser);color:var(--mute)}
.row{display:grid;grid-template-columns:44px 1fr auto;gap:4px 10px;align-items:center;border:3px solid var(--ink);border-radius:16px;background:var(--bg3);padding:8px;margin-bottom:8px}
.row.lockedrow{opacity:.55}
.avatar{width:44px;height:44px;border-radius:50%;border:3px solid var(--ink);display:grid;place-items:center;font-family:var(--ser);font-weight:800;color:var(--ink);font-size:15px}
.rname{font-family:var(--ser);font-weight:800;font-size:17px;line-height:1.1}.rname small{font-size:13px;color:var(--mute);font-family:var(--sans)}
.rinfo{font-size:13px;color:var(--mute)}
.bar{grid-column:1/-1;height:12px;border:3px solid var(--ink);border-radius:999px;background:var(--ink);overflow:hidden}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--teal),var(--gold))}
.acts{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap}.acts .btn{flex:1 1 120px}
.card{border:3px solid var(--ink);border-radius:16px;background:var(--bg3);padding:12px;margin-bottom:10px}
.card h3{margin:0 0 4px;font-family:var(--ser);font-size:19px;color:var(--gold)}.card p{margin:4px 0 8px;font-size:14px;color:var(--mute)}
.shoprow{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;padding:8px 0;border-top:2px dashed rgba(255,255,255,.14)}.shoprow:first-of-type{border-top:0}
.shoprow b{font-family:var(--ser);font-size:16px}.shoprow span{font-size:13px;color:var(--mute)}.lv{color:var(--teal)}
.skins{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.skincard{border:3px solid var(--ink);border-radius:14px;background:var(--bg);padding:8px;text-align:center}.skincard.worn{outline:3px solid var(--teal)}.skincard b{display:block;font-family:var(--ser)}
.sw{height:34px;border-radius:10px;border:3px solid var(--ink);margin:4px 0 8px}
.crewskin{display:grid;grid-template-columns:1fr;gap:4px;border-top:2px dashed rgba(255,255,255,.14);padding:8px 0}.crewskin>div{display:flex;gap:4px;flex-wrap:wrap}.crewskin .btn{flex:1 1 60px;font-size:13px;min-height:36px;padding:2px 6px}
.ach{display:flex;gap:8px;align-items:center;padding:6px 0;border-top:2px dashed rgba(255,255,255,.14);font-size:14px}.ach.got{color:var(--text)}.ach:not(.got){color:var(--mute);opacity:.7}.ach i{font-style:normal;width:26px;text-align:center}
input.text{width:100%;min-height:44px;border:3px solid var(--ink);border-radius:12px;padding:6px 10px;background:var(--bg);color:var(--text)}
.stat{display:flex;justify-content:space-between;padding:4px 0;font-size:14px}.stat b{color:var(--gold)}
.dock{position:fixed;left:0;right:var(--pw);bottom:0;padding:12px;display:flex;justify-content:center;gap:10px;z-index:5;pointer-events:none}.dock>*{pointer-events:auto}
#mine{min-width:220px;min-height:56px;font-size:21px}
#labels{position:fixed;inset:0;right:var(--pw);pointer-events:none;z-index:2;overflow:hidden}
.lab{position:absolute;transform:translate(-50%,-100%);padding:1px 8px;border:2px solid var(--ink);border-radius:999px;background:rgba(21,11,58,.82);font-family:var(--ser);font-weight:800;font-size:12px;white-space:nowrap}.lab small{color:var(--gold)}
#floaters{position:fixed;inset:0;pointer-events:none;z-index:4;overflow:hidden}
.fl{position:absolute;font-family:var(--ser);font-weight:800;font-size:24px;color:var(--gold);text-shadow:0 3px 0 var(--ink);animation:fl .9s ease-out forwards;white-space:nowrap}
@keyframes fl{from{transform:translate(-50%,0) scale(.8);opacity:1}to{transform:translate(-50%,-70px) scale(1.15);opacity:0}}
#toasts{position:fixed;top:150px;left:0;right:var(--pw);display:flex;flex-direction:column;align-items:center;gap:6px;z-index:8;pointer-events:none}
.toast{border:3px solid var(--ink);border-radius:14px;background:var(--bg3);padding:8px 14px;font-family:var(--ser);font-weight:800;box-shadow:0 4px 0 var(--ink);animation:ti .25s ease-out;max-width:90%;text-align:center}.toast.gold{background:var(--gold);color:var(--ink)}.toast.pink{background:var(--pink);color:var(--ink)}
@keyframes ti{from{transform:translateY(-12px);opacity:0}to{transform:none;opacity:1}}
#modal{position:fixed;inset:0;display:none;place-items:center;background:rgba(11,6,32,.7);z-index:20;padding:16px}#modal.show{display:grid}
.dlg{width:min(460px,100%);border:4px solid var(--ink);border-radius:20px;background:var(--bg2);padding:18px;box-shadow:0 8px 0 var(--ink);max-height:90vh;overflow:auto}.dlg h2{margin:0 0 8px;font-family:var(--ser);color:var(--gold)}.dlg p{margin:6px 0;color:var(--text)}.dlg .acts{margin-top:14px}
.nogl #stage{display:none}.fallback{display:none}.nogl .fallback{display:grid;position:fixed;inset:0;right:var(--pw);place-items:center;z-index:1;text-align:center;padding:20px}
.fallback button{width:min(60vmin,320px);aspect-ratio:1;border-radius:50%;border:8px solid var(--ink);background:radial-gradient(circle at 35% 30%,#fff2b0,#ffc83d 45%,#e0861a);font-family:var(--ser);font-weight:800;font-size:44px;color:#7a4200;cursor:pointer;box-shadow:0 10px 0 var(--ink)}
.fallback p{max-width:360px;font-size:14px;color:var(--mute)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

 .hud{right:0;padding:8px 10px;gap:8px}.logo svg.lw{display:none}.logo svg{width:32px;height:32px}.coinname{font-size:15px}.ps{font-size:13px}.tier{height:10px}.tiernote{display:none}
 .dock{right:0;bottom:46vh;padding:6px;gap:6px}#mine{min-height:46px;min-width:170px;font-size:17px}.ab{min-width:64px;min-height:46px;font-size:11px}.ab b{font-size:17px}.hype{height:18px}.hype span{font-size:11px;line-height:12px}.abil{flex-wrap:nowrap;width:100%;gap:4px}.ab{flex:1 1 0;min-width:0;padding:2px 2px;font-size:10px}.ab .cd{font-size:14px}.tools{flex-direction:column;gap:4px}.tools .btn{min-height:36px;padding:2px 8px;font-size:12px}#labels{right:0;bottom:46vh}.nogl .fallback{right:0;bottom:46vh}#toasts{right:0;top:118px}

.dock{flex-direction:column;align-items:center;gap:8px}

.fl.crit{font-size:36px;color:#ff4f9a;z-index:6}
