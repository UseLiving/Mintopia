<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;--bg:#150b3a;--bg2:#1f1250;--bg3:#2c1a6c;--line:#4a2fb0;--ink:#0b0620;--text:#fff6e3;--mute:#cdbeff;--gold:#ffc83d;--gold2:#ff9a2f;--teal:#25d9b5;--pink:#ff4f9a;--blue:#2f5fe0;--bad:#ff6b8a;--ser:'Baloo 2','Arial Rounded MT Bold','DejaVu Sans',Arial,sans-serif;--sans:Nunito,'DejaVu Sans',Arial,sans-serif;--pw:420px;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;height:100%;background:linear-gradient(#150b3a,#2c1a8a 55%,#3a22a6);color:var(--text);font-family:var(--sans);font-weight:600;overflow:hidden;-webkit-tap-highlight-color:transparent}
body{display:flex}button,input{font:inherit}
#sky{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0}
#stage{z-index:1;position:fixed;left:0;top:0;right:var(--pw);bottom:0;width:calc(100% - var(--pw));height:100%;display:block;touch-action:none;cursor:pointer;outline:none}
#stage:focus-visible{box-shadow:inset 0 0 0 4px var(--gold)}
.hud{position:fixed;top:0;left:0;right:var(--pw);padding:10px 14px;display:flex;gap:12px;align-items:flex-start;pointer-events:none;z-index:5}
.hud>*{pointer-events:auto}
.logo{display:flex;align-items:center;gap:8px;font-family:var(--ser);font-weight:800;font-size:22px;color:var(--gold);text-shadow:0 3px 0 var(--ink);white-space:nowrap}
.logo svg.lm{width:48px;height:50px;flex:none;filter:drop-shadow(0 3px 5px rgba(11,6,32,.55))}.logo svg.lw{height:34px;width:auto;flex:none;filter:drop-shadow(0 3px 5px rgba(11,6,32,.55))}
.bank{flex:1;text-align:center;min-width:0}
.coins{font-family:var(--ser);font-weight:800;font-size:clamp(34px,5.6vw,56px);line-height:1;color:var(--gold);text-shadow:0 4px 0 var(--ink),0 0 24px rgba(255,200,61,.45);letter-spacing:-1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.coinname{font-family:var(--ser);font-weight:800;font-size:18px;color:var(--text);text-shadow:0 2px 0 var(--ink)}
.ps{font-size:15px;color:var(--mute);text-shadow:0 2px 0 var(--ink)}
.tier{height:12px;max-width:340px;margin:6px auto 0;border:3px solid var(--ink);border-radius:999px;background:rgba(11,6,32,.7);overflow:hidden}
.tier i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--pink))}
.tiernote{font-size:12px;color:var(--mute);text-shadow:0 2px 0 var(--ink);margin-top:2px}
.tools{display:flex;gap:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:8px 14px;border:3px solid var(--ink);border-radius:14px;background:var(--gold);color:var(--ink);font-family:var(--ser);font-weight:800;font-size:16px;cursor:pointer;box-shadow:0 4px 0 var(--ink);transition:transform .1s,box-shadow .1s,filter .1s;user-select:none;text-align:center;line-height:1.1}
.btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 6px 0 var(--ink)}.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn:disabled{filter:grayscale(.85) brightness(.7);cursor:not-allowed;box-shadow:0 2px 0 var(--ink)}
.btn.teal{background:var(--teal)}.btn.pink{background:var(--pink)}.btn.blue{background:var(--blue);color:#fff}.btn.ghost{background:var(--bg3);color:var(--text)}.btn.sm{min-height:36px;padding:4px 10px;font-size:14px}.btn.on{outline:3px solid var(--text)}
.btn:focus-visible,#stage:focus-visible,.tab:focus-visible,input:focus-visible{outline:3px solid #fff;outline-offset:2px}
.panel{position:fixed;top:0;right:0;bottom:0;width:var(--pw);background:var(--bg2);border-left:4px solid var(--ink);display:flex;flex-direction:column;z-index:6;box-shadow:-8px 0 0 rgba(11,6,32,.35)}
.tabs{display:flex;gap:4px;padding:8px 8px 0;background:var(--bg);border-bottom:4px solid var(--ink)}
.tab{flex:1 1 0;min-width:0;min-height:44px;padding:0 2px;border:3px solid var(--ink);border-bottom:0;border-radius:12px 12px 0 0;background:var(--bg3);color:var(--mute);font-family:var(--ser);font-weight:800;font-size:clamp(10px,3.1vw,13.5px);cursor:pointer;position:relative;overflow:hidden}
.tab[aria-selected=true]{background:var(--gold);color:var(--ink)}
.tab .dot{position:absolute;top:2px;right:4px;width:12px;height:12px;border-radius:50%;background:var(--pink);border:2px solid var(--ink);display:none}.tab .dot.show{display:block}
.view{flex:1;overflow-y:auto;padding:10px;scrollbar-width:thin}
.buyq{display:flex;gap:6px;margin-bottom:10px;align-items:center;flex-wrap:wrap}.buyq b{font-family:var(--ser);color:var(--mute)}
.row{display:grid;grid-template-columns:44px 1fr auto;gap:4px 10px;align-items:center;border:3px solid var(--ink);border-radius:16px;background:var(--bg3);padding:8px;margin-bottom:8px}
.row.lockedrow{opacity:.55}
.avatar{width:44px;height:44px;border-radius:50%;border:3px solid var(--ink);display:grid;place-items:center;font-family:var(--ser);font-weight:800;color:var(--ink);font-size:15px}
.rname{font-family:var(--ser);font-weight:800;font-size:17px;line-height:1.1}.rname small{font-size:13px;color:var(--mute);font-family:var(--sans)}
.rinfo{font-size:13px;color:var(--mute)}
.bar{grid-column:1/-1;height:12px;border:3px solid var(--ink);border-radius:999px;background:var(--ink);overflow:hidden}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--teal),var(--gold))}
.acts{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap}.acts .btn{flex:1 1 120px}
.card{border:3px solid var(--ink);border-radius:16px;background:var(--bg3);padding:12px;margin-bottom:10px}
.card h3{margin:0 0 4px;font-family:var(--ser);font-size:19px;color:var(--gold)}.card p{margin:4px 0 8px;font-size:14px;color:var(--mute)}
.shoprow{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;padding:8px 0;border-top:2px dashed rgba(255,255,255,.14)}.shoprow:first-of-type{border-top:0}
.shoprow b{font-family:var(--ser);font-size:16px}.shoprow span{font-size:13px;color:var(--mute)}.lv{color:var(--teal)}
.skins{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.skincard{border:3px solid var(--ink);border-radius:14px;background:var(--bg);padding:8px;text-align:center}.skincard.worn{outline:3px solid var(--teal)}.skincard b{display:block;font-family:var(--ser)}
.sw{height:34px;border-radius:10px;border:3px solid var(--ink);margin:4px 0 8px}
.crewskin{display:grid;grid-template-columns:1fr;gap:4px;border-top:2px dashed rgba(255,255,255,.14);padding:8px 0}.crewskin>div{display:flex;gap:4px;flex-wrap:wrap}.crewskin .btn{flex:1 1 60px;font-size:13px;min-height:36px;padding:2px 6px}
.ach{display:flex;gap:8px;align-items:center;padding:6px 0;border-top:2px dashed rgba(255,255,255,.14);font-size:14px}.ach.got{color:var(--text)}.ach:not(.got){color:var(--mute);opacity:.7}.ach i{font-style:normal;width:26px;text-align:center}
input.text{width:100%;min-height:44px;border:3px solid var(--ink);border-radius:12px;padding:6px 10px;background:var(--bg);color:var(--text)}
.stat{display:flex;justify-content:space-between;padding:4px 0;font-size:14px}.stat b{color:var(--gold)}
.dock{position:fixed;left:0;right:var(--pw);bottom:0;padding:12px;display:flex;justify-content:center;gap:10px;z-index:5;pointer-events:none}.dock>*{pointer-events:auto}
#mine{min-width:220px;min-height:56px;font-size:21px}
#labels{position:fixed;inset:0;right:var(--pw);pointer-events:none;z-index:2;overflow:hidden}
.lab{position:absolute;transform:translate(-50%,-100%);padding:1px 8px;border:2px solid var(--ink);border-radius:999px;background:rgba(21,11,58,.82);font-family:var(--ser);font-weight:800;font-size:12px;white-space:nowrap}.lab small{color:var(--gold)}
#floaters{position:fixed;inset:0;pointer-events:none;z-index:4;overflow:hidden}
.fl{position:absolute;font-family:var(--ser);font-weight:800;font-size:24px;color:var(--gold);text-shadow:0 3px 0 var(--ink);animation:fl .9s ease-out forwards;white-space:nowrap}
@keyframes fl{from{transform:translate(-50%,0) scale(.8);opacity:1}to{transform:translate(-50%,-70px) scale(1.15);opacity:0}}
#toasts{position:fixed;top:150px;left:0;right:var(--pw);display:flex;flex-direction:column;align-items:center;gap:6px;z-index:8;pointer-events:none}
.toast{border:3px solid var(--ink);border-radius:14px;background:var(--bg3);padding:8px 14px;font-family:var(--ser);font-weight:800;box-shadow:0 4px 0 var(--ink);animation:ti .25s ease-out;max-width:90%;text-align:center}.toast.gold{background:var(--gold);color:var(--ink)}.toast.pink{background:var(--pink);color:var(--ink)}
@keyframes ti{from{transform:translateY(-12px);opacity:0}to{transform:none;opacity:1}}
#modal{position:fixed;inset:0;display:none;place-items:center;background:rgba(11,6,32,.7);z-index:20;padding:16px}#modal.show{display:grid}
.dlg{width:min(460px,100%);border:4px solid var(--ink);border-radius:20px;background:var(--bg2);padding:18px;box-shadow:0 8px 0 var(--ink);max-height:90vh;overflow:auto}.dlg h2{margin:0 0 8px;font-family:var(--ser);color:var(--gold)}.dlg p{margin:6px 0;color:var(--text)}.dlg .acts{margin-top:14px}
.nogl #stage{display:none}.fallback{display:none}.nogl .fallback{display:grid;position:fixed;inset:0;right:var(--pw);place-items:center;z-index:1;text-align:center;padding:20px}
.fallback button{width:min(60vmin,320px);aspect-ratio:1;border-radius:50%;border:8px solid var(--ink);background:radial-gradient(circle at 35% 30%,#fff2b0,#ffc83d 45%,#e0861a);font-family:var(--ser);font-weight:800;font-size:44px;color:#7a4200;cursor:pointer;box-shadow:0 10px 0 var(--ink)}
.fallback p{max-width:360px;font-size:14px;color:var(--mute)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

 .hud{right:0;padding:8px 10px;gap:8px}.logo svg.lw{display:none}.logo svg{width:32px;height:32px}.coinname{font-size:15px}.ps{font-size:13px}.tier{height:10px}.tiernote{display:none}
 .dock{right:0;bottom:46vh;padding:6px;gap:6px}#mine{min-height:46px;min-width:170px;font-size:17px}.ab{min-width:64px;min-height:46px;font-size:11px}.ab b{font-size:17px}.hype{height:18px}.hype span{font-size:11px;line-height:12px}.abil{flex-wrap:nowrap;width:100%;gap:4px}.ab{flex:1 1 0;min-width:0;padding:2px 2px;font-size:10px}.ab .cd{font-size:14px}.tools{flex-direction:column;gap:4px}.tools .btn{min-height:36px;padding:2px 8px;font-size:12px}#labels{right:0;bottom:46vh}.nogl .fallback{right:0;bottom:46vh}#toasts{right:0;top:118px}

.dock{flex-direction:column;align-items:center;gap:8px}

.fl.crit{font-size:36px;color:#ff4f9a;z-index:6}

function fmt(v,d){if(!isFinite(v))return v>0?'Infinity':'0';if(v<0)return '-'+fmt(-v,d);d=d==null?2:d;if(v<1000)return (v>=100?v.toFixed(0):v>=10?v.toFixed(Math.min(d,1)):v.toFixed(d)).replace(/\.0+$/,'').replace(/(\.\d*[1-9])0+$/,'$1');var e=Math.floor(Math.log10(v)/3),m;if(e>=SUF.length)return v.toExponential(2).replace(/\.?0+e/,'e').replace('e+','e');m=v/Math.pow(1000,e);if(m>=999.995){m=1;e++}return m.toFixed(m>=100?0:m>=10?1:2).replace(/\.0+$/,'').replace(/(\.\d*[1-9])0+$/,'$1')+SUF[e]}
function fmtTime(s){if(!isFinite(s))return '-';if(s<10)return s.toFixed(1)+'s';if(s<60)return Math.round(s)+'s';if(s<3600)return Math.floor(s/60)+'m '+Math.round(s%60)+'s';if(s<86400)return Math.floor(s/3600)+'h '+Math.floor((s%3600)/60)+'m';return Math.floor(s/86400)+'d '+Math.floor((s%86400)/3600)+'h'}
function tierOf(c){var k=0;while(k+1<TIER_AT.length&&c>=TIER_AT[k+1])k++;return k}

// ---- the state of a game
function newGame(now){var S={v:HH_VERSION,coins:0,runCoins:0,cycleCoins:0,allCoins:0,totalClicks:0,gens:[],ups:{},pt:0,ptTotal:0,pshop:{},rt:0,rtTotal:0,rshop:{},prestiges:0,rebirths:0,ach:{},coinSkin:{owned:{gold:1},active:'gold'},charSkins:[],buff:{until:0,mult:1},t:now||0,airdrops:0,autoAcc:0,name:'Hero',sound:false,music:true,musicVol:.5,quality:'high',hype:0,fx:{frenzy:0,overdrive:0,lucky:0},cd:{frenzy:0,overdrive:0,storm:0,lucky:0},maxTier:0,crits:0,abilUsed:0,hypeMax:0};for(var i=0;i<GEN.length;i++){S.gens.push({n:0,mgr:false,prog:0,run:false});S.charSkins.push({owned:{default:1},active:'default'})}return S}
function lvl(S,id){return (SHOPBY[id].cur==='pt'?S.pshop:S.rshop)[id]||0}
function achCount(S){var c=0;for(var k in S.ach)if(S.ach[k])c++;return c}
function tierMult(S){return 1+.03*tierOf(S.runCoins)}
function ptMult(S){return 1+.02*S.ptTotal*(1+.2*lvl(S,'p_boost'))}
function rtMult(S){return 1+.5*S.rtTotal*(1+.5*lvl(S,'r_mult')*0)+.5*lvl(S,'r_mult')}
function globalMult(S){var m=(1+.02*achCount(S))*tierMult(S)*ptMult(S)*rtMult(S);UPS.forEach(function(u){if(u.kind==='global'&&S.ups[u.id])m*=u.mult});return m}
function buffMult(S,now){return S.buff.until>now?S.buff.mult:1}
function milestoneMult(n){var c=0;for(var i=0;i<MILESTONES.length;i++)if(n>=MILESTONES[i])c++;return Math.pow(2,c)}
function discount(S){return Math.min(.6,.03*lvl(S,'p_disc'))}
function genCost(S,i,k){var g=GEN[i],n=S.gens[i].n;if(k<1)return 0;return Math.min(ENDCAP,g.cost*Math.pow(g.coef,n)*(Math.pow(g.coef,k)-1)/(g.coef-1)*(1-discount(S)))}
function maxBuy(S,i){var g=GEN[i],n=S.gens[i].n,base=g.cost*Math.pow(g.coef,n)*(1-discount(S));if(S.coins<base)return 0;var k=Math.floor(Math.log(1+S.coins*(g.coef-1)/base)/Math.log(g.coef)+1e-9);while(k>0&&genCost(S,i,k)>S.coins)k--;while(genCost(S,i,k+1)<=S.coins&&k<1e5)k++;return Math.max(0,k)}
function mgrCost(S,i){return GEN[i].mgr*(1-.25*lvl(S,'r_mgr'))*(1-discount(S))}
function upCount(S,kind){var c=0,a=UPK[kind];for(var k=0;k<a.length;k++)if(S.ups[a[k]])c++;return c}
function speedMult(S){return Math.pow(1.1,lvl(S,'p_speed'))*Math.pow(1.1,upCount(S,'speed'))}
function nowS(n){return n==null?Date.now()/1000:n}
function fxOn(S,id,now){return S.fx[id]>nowS(now)}
function abLvl(S,id){return lvl(S,'a_'+id)}
function hypeSpeed(S){return 1+.5*S.hype/100}
function crewBoost(S,now){return hypeSpeed(S)*(fxOn(S,'overdrive',now)?2+.25*abLvl(S,'overdrive'):1)}
function genSpeed(S,i){return (1+Math.min(1,Math.max(0,S.gens[i].n-1)/250))*Math.pow(1.1,genUpCount(S,i))}
function cycleTime(S,i,now){return GEN[i].time/(speedMult(S)*genSpeed(S,i)*crewBoost(S,now))}
function genUpCount(S,i){var c=0,a=UPGEN[i];for(var k=0;k<a.length;k++)if(S.ups[a[k]])c++;return c}
function genMult(S,i){return milestoneMult(S.gens[i].n)*Math.pow(3,genUpCount(S,i))}
function payout(S,i,now){return Math.min(ENDCAP,S.gens[i].n*GEN[i].rev*genMult(S,i)*globalMult(S)*buffMult(S,now||0))}
function genRate(S,i,now){return S.gens[i].n>0?payout(S,i,now)/cycleTime(S,i,now):0}
function cps(S,now){var s=0;for(var i=0;i<GEN.length;i++)if(S.gens[i].mgr)s+=genRate(S,i,now);return s}
function clickMult(S){var m=Math.pow(2,lvl(S,'p_click'))*Math.pow(3,lvl(S,'r_click'));UPS.forEach(function(u){if(u.kind==='click'&&S.ups[u.id])m*=2});return m}
function clickPct(S){var p=0;UPS.forEach(function(u){if(u.kind==='clickpct'&&S.ups[u.id])p+=u.pct});return p}
function hypeClick(S){return 1+1.5*S.hype/100}
function frenzyMult(S,now){return fxOn(S,'frenzy',now)?7+abLvl(S,'frenzy'):1}
function critChance(S,now){var c=.05*upCount(S,'crit');if(fxOn(S,'lucky',now))c=1;return Math.min(1,c)}
function critMult(S){return 10+5*upCount(S,'critmult')}
function clickValue(S,now){return Math.min(ENDCAP,clickMult(S)*globalMult(S)*buffMult(S,now||0)*frenzyMult(S,now)*hypeClick(S)+clickPct(S)*cps(S,now))}
function earn(S,v){if(!(v>0))return;S.coins=Math.min(ENDCAP,S.coins+v);S.runCoins=Math.min(ENDCAP,S.runCoins+v);while(S.maxTier+1<TIER_AT.length&&S.runCoins>=TIER_AT[S.maxTier+1])S.maxTier++;S.cycleCoins=Math.min(ENDCAP,S.cycleCoins+v);S.allCoins=Math.min(ENDCAP,S.allCoins+v)}
function mine(S,now,rnd){var v=clickValue(S,now),cc=critChance(S,now);S.lastCrit=false;if(cc>0&&(rnd||Math.random)()<cc){v=Math.min(ENDCAP,v*critMult(S));S.lastCrit=true;S.crits++}earn(S,v);S.totalClicks++;return v}
function addHype(S,n){S.hype=Math.min(100,S.hype+(n==null?6:n));if(S.hype>S.hypeMax)S.hypeMax=S.hype}
function buyGen(S,i,k){if(i<0||i>=GEN.length||!(k>=1))return 0;k=Math.floor(k);var c=genCost(S,i,k);if(S.coins<c||c<=0)return 0;S.coins-=c;S.gens[i].n+=k;return k}
function buyGenMax(S,i){var k=maxBuy(S,i);return k>0?buyGen(S,i,k):0}
function hireMgr(S,i){if(i<0||i>=GEN.length||S.gens[i].mgr||S.gens[i].n<1)return false;var c=mgrCost(S,i);if(S.coins<c)return false;S.coins-=c;S.gens[i].mgr=true;S.gens[i].run=true;return true}
function runGen(S,i){var g=S.gens[i];if(!g||g.n<1||g.mgr||g.run)return false;g.run=true;g.prog=0;return true}
function upAvailable(S,u){return !S.ups[u.id]&&(u.kind!=='gen'||S.gens[u.gen].n>=u.need)}
function buyUp(S,id){var u=UPBY[id];if(!u||!upAvailable(S,u)||S.coins<u.cost*(1-discount(S)))return false;S.coins-=u.cost*(1-discount(S));S.ups[id]=1;return true}
function upCost(S,u){return u.cost*(1-discount(S))}
// ---- time passes: cycles finish and pay out
var LAST={paid:[]};
function tick(S,dt,now){LAST.paid=[];if(!(dt>0))return 0;var gained=0,i,g,T,pr,done;now=now||0;S.hype=Math.max(0,S.hype-18*dt);
 var ac=lvl(S,'p_auto')*2;if(ac>0){S.autoAcc+=ac*dt;var n=Math.floor(S.autoAcc);if(n>0){S.autoAcc-=n;for(i=0;i<Math.min(n,50);i++)gained+=mine(S,now)}}
 for(i=0;i<GEN.length;i++){g=S.gens[i];if(g.n<1||!g.run)continue;T=cycleTime(S,i,now);g.prog+=dt/T;if(g.prog>=1){done=Math.floor(g.prog);pr=payout(S,i,now);LAST.paid.push(i);if(g.mgr){g.prog-=done;earn(S,pr*done);gained+=pr*done}else{g.prog=0;g.run=false;earn(S,pr);gained+=pr}}}
 return gained}
function offlineRate(S){return .25+.2*lvl(S,'p_off')}
function offlineCap(S){return (8+4*lvl(S,'r_cap'))*3600}
function offline(S,seconds){seconds=Math.min(Math.max(0,seconds),offlineCap(S));if(seconds<1)return 0;S.hype=0;var g=cps(S,0)*seconds*offlineRate(S);earn(S,g);for(var i=0;i<GEN.length;i++)if(S.gens[i].mgr)S.gens[i].prog=0;return g}
// ---- prestige and rebirth
function prestigeTotal(S){return Math.floor(Math.sqrt(S.cycleCoins/1e7))}
function prestigeGain(S){return Math.max(0,prestigeTotal(S)-S.ptTotal)}
function startKit(S){var L=Math.min(GEN.length,lvl(S,'p_start'));for(var i=0;i<L;i++){S.gens[i].n=1;S.gens[i].mgr=true;S.gens[i].run=true}}
function doPrestige(S){var g=prestigeGain(S);if(g<1)return 0;S.pt+=g;S.ptTotal+=g;S.prestiges++;S.coins=0;S.runCoins=0;S.ups={};S.buff={until:0,mult:1};S.autoAcc=0;for(var i=0;i<GEN.length;i++)S.gens[i]={n:0,mgr:false,prog:0,run:false};startKit(S);return g}
function canRebirth(S){return S.ptTotal>=100}
function rebirthGain(S){return canRebirth(S)?Math.max(1,Math.floor(Math.sqrt(S.ptTotal/25))):0}
function doRebirth(S){if(!canRebirth(S))return 0;var g=rebirthGain(S),keep=Math.min(.5,.1*lvl(S,'r_keep')),kept=Math.floor(S.ptTotal*keep),head=5*lvl(S,'r_head');S.rt+=g;S.rtTotal+=g;S.rebirths++;S.pshop={};S.pt=kept+head;S.ptTotal=kept+head;S.cycleCoins=0;S.coins=0;S.runCoins=0;S.ups={};S.buff={until:0,mult:1};S.autoAcc=0;for(var i=0;i<GEN.length;i++)S.gens[i]={n:0,mgr:false,prog:0,run:false};return g}
// ---- shops
function shopCost(S,id){var s=SHOPBY[id],l=lvl(S,id);return Math.ceil(s.lin?s.base+l:s.base*Math.pow(s.grow,l))}
function buyShop(S,id){var s=SHOPBY[id];if(!s)return false;var l=lvl(S,id);if(l>=s.max)return false;var c=shopCost(S,id),cur=s.cur;if(S[cur]<c)return false;S[cur]-=c;(cur==='pt'?S.pshop:S.rshop)[id]=l+1;if(id==='p_start'&&S.runCoins===0&&S.gens.every(function(g){return g.n===0}))startKit(S);return true}
// ---- skins
function skinCost(kind,id){var l=(kind==='coin'?COIN_SKINS:CHAR_SKINS).filter(function(s){return s.id===id})[0];return l||null}
function buySkin(S,kind,id,idx){var sk=skinCost(kind,id);if(!sk)return false;var box=kind==='coin'?S.coinSkin:S.charSkins[idx];if(!box||box.owned[id])return false;if(sk.cur!=='free'){if(S[sk.cur]<sk.cost)return false;S[sk.cur]-=sk.cost}box.owned[id]=1;return true}
function setSkin(S,kind,id,idx){var box=kind==='coin'?S.coinSkin:S.charSkins[idx];if(!box||!box.owned[id])return false;box.active=id;return true}
// ---- abilities
function abilityUnlocked(S,a){return S.maxTier>=a.tier}
function abilityCd(S,a){return a.cd*(1-.05*abLvl(S,a.id))}
function abilityDur(S,a){return a.dur>0?a.dur+abLvl(S,a.id):0}
function abilityLeft(S,a,now){return Math.max(0,S.cd[a.id]-nowS(now))}
function useAbility(S,id,now){var a=ABBY[id];now=nowS(now);if(!a||!abilityUnlocked(S,a)||S.cd[id]>now)return null;S.cd[id]=now+abilityCd(S,a);S.abilUsed++;if(id==='storm'){var v=Math.max(cps(S,now)*120*(1+.25*abLvl(S,'storm')),clickValue(S,now)*60);earn(S,v);return {id:id,amount:v}}S.fx[id]=now+abilityDur(S,a);return {id:id,seconds:abilityDur(S,a)}}
// ---- airdrops and achievements
function airdropGap(S,rnd){return (60+120*rnd())/(1+.25*lvl(S,'p_air'))}
function claimAirdrop(S,now,rnd){S.airdrops++;if(rnd()<.5){var v=Math.max(clickValue(S,now)*30,cps(S,now)*60*(1+.2*lvl(S,'p_air')));earn(S,v);return {type:'coins',amount:v}}S.buff={until:now+30+5*lvl(S,'p_air'),mult:7};return {type:'buff',seconds:30+5*lvl(S,'p_air')}}
function checkAch(S){var out=[];ACH.forEach(function(a){if(!S.ach[a[0]]&&a[3](S)){S.ach[a[0]]=1;out.push(a)}});return out}
// ---- saving, loading and sharing
function serialize(S){return JSON.stringify(S)}
function sanitize(r,now){var S=newGame(now),i,k;if(!r||typeof r!=='object')return S;

 S.totalClicks=Math.floor(nz(r.totalClicks,0,0,1e12));S.prestiges=Math.floor(nz(r.prestiges,0,0,1e6));S.rebirths=Math.floor(nz(r.rebirths,0,0,1e6));S.airdrops=Math.floor(nz(r.airdrops,0,0,1e9));
 if(Array.isArray(r.gens))for(i=0;i<GEN.length;i++){var g=r.gens[i];if(g&&typeof g==='object')S.gens[i]={n:Math.floor(nz(g.n,0,0,1e6)),mgr:!!g.mgr,prog:nz(g.prog,0,0,1e6),run:!!g.run||!!g.mgr}}
 if(r.ups&&typeof r.ups==='object')for(k in r.ups)if(UPBY[k]&&r.ups[k])S.ups[k]=1;
 [[r.pshop,S.pshop,'pt'],[r.rshop,S.rshop,'rt']].forEach(function(p){if(p[0]&&typeof p[0]==='object')for(var id in p[0])if(SHOPBY[id]&&SHOPBY[id].cur===p[2]){var l=Math.floor(nz(p[0][id],0,0,SHOPBY[id].max));if(l>0)p[1][id]=l}});
 if(r.ach&&typeof r.ach==='object')ACH.forEach(function(a){if(r.ach[a[0]])S.ach[a[0]]=1});
 function skinBox(src,list,box){if(!src||typeof src!=='object')return;var own=src.owned&&typeof src.owned==='object'?src.owned:{};list.forEach(function(s){if(own[s.id]||s.cur==='free')box.owned[s.id]=1});if(box.owned[src.active])box.active=src.active}
 skinBox(r.coinSkin,COIN_SKINS,S.coinSkin);if(Array.isArray(r.charSkins))for(i=0;i<GEN.length;i++)skinBox(r.charSkins[i],CHAR_SKINS,S.charSkins[i]);
 if(r.buff&&typeof r.buff==='object')S.buff={until:nz(r.buff.until,0,0,1e15),mult:nz(r.buff.mult,1,1,100)};
 if(r.fx&&typeof r.fx==='object')['frenzy','overdrive','lucky'].forEach(function(k){S.fx[k]=nz(r.fx[k],0,0,1e15)});if(r.cd&&typeof r.cd==='object')['frenzy','overdrive','storm','lucky'].forEach(function(k){S.cd[k]=nz(r.cd[k],0,0,1e15)});S.hype=nz(r.hype,0,0,100);S.maxTier=Math.floor(nz(r.maxTier,0,0,TIER_AT.length-1));S.crits=Math.floor(nz(r.crits,0,0,1e12));S.abilUsed=Math.floor(nz(r.abilUsed,0,0,1e12));S.hypeMax=nz(r.hypeMax,0,0,100);S.music=r.music!==false;S.musicVol=nz(r.musicVol,.5,0,1);S.t=nz(r.t,now||0,0,1e15);S.autoAcc=nz(r.autoAcc,0,0,1e3);S.name=typeof r.name==='string'&&/^[A-Za-z0-9 _-]{1,16}$/.test(r.name)?r.name:'Hero';S.sound=!!r.sound;S.quality=r.quality==='low'?'low':'high';return S}
function deserialize(txt,now){var r=null;try{r=JSON.parse(txt)}catch(e){}return sanitize(r,now)}
function hash32(s){var x=2166136261;for(var i=0;i<s.length;i++){x^=s.charCodeAt(i);x=Math.imul(x,16777619)}return (x>>>0).toString(16)}
function exportCode(S){var j=serialize(S);return btoa(unescape(encodeURIComponent(j)))+'.'+hash32(j)}

// ======== coin emblems, drawn in code: the real coins get their well-known marks, the invented ones get their own ========
function icoPoly(x,pts,fill,stroke,lw){x.beginPath();pts.forEach(function(p,i){i?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1])});x.closePath();if(fill){x.fillStyle=fill;x.fill()}if(stroke){x.lineWidth=lw||2;x.strokeStyle=stroke;x.stroke()}}
function icoDisc(x,cx,cy,r,fill,stroke,lw){x.beginPath();x.arc(cx,cy,r,0,6.2832);if(fill){x.fillStyle=fill;x.fill()}if(stroke){x.lineWidth=lw||2;x.strokeStyle=stroke;x.stroke()}}
function icoText(x,t,cx,cy,size,fill,font){x.fillStyle=fill;x.font='900 '+size+'px '+(font||'"Baloo 2","Arial Black",Arial,sans-serif');x.textAlign='center';x.textBaseline='middle';x.fillText(t,cx,cy)}
function icoGrad(x,x0,y0,x1,y1,c0,c1){var g=x.createLinearGradient(x0,y0,x1,y1);g.addColorStop(0,c0);g.addColorStop(1,c1);return g}
function icoRays(x,cx,cy,r0,r1,n,col,w,rot){x.strokeStyle=col;x.lineWidth=w;x.lineCap='round';for(var i=0;i<n;i++){var a=(rot||0)+i/n*6.2832;x.beginPath();x.moveTo(cx+Math.cos(a)*r0,cy+Math.sin(a)*r0);x.lineTo(cx+Math.cos(a)*r1,cy+Math.sin(a)*r1);x.stroke()}}
var ICON=[];
ICON[0]=function(x,c,y,r){icoDisc(x,c,y,r,'#b99a6a');for(var i=0;i<9;i++){icoDisc(x,c+Math.cos(i*2.4)*r*.5,y+Math.sin(i*2.4)*r*.45,r*.09,'#e8d3a2')}icoDisc(x,c,y,r*.28,'#8a7348')};
ICON[1]=function(x,c,y,r){icoDisc(x,c,y,r,'#4aa84a');icoDisc(x,c-r*.4,y-r*.42,r*.3,'#fff');icoDisc(x,c+r*.4,y-r*.42,r*.3,'#fff');icoDisc(x,c-r*.36,y-r*.4,r*.13,'#111');icoDisc(x,c+r*.44,y-r*.4,r*.13,'#111');x.strokeStyle='#14320f';x.lineWidth=r*.1;x.lineCap='round';x.beginPath();x.arc(c,y+r*.05,r*.55,.25,2.9);x.stroke();icoDisc(x,c,y+r*.62,r*.18,'#e44b6a')};
ICON[2]=function(x,c,y,r){icoDisc(x,c,y,r,'#e5400c');icoPoly(x,[[c-r*.7,y-r*.1],[c-r*.62,y-r*.8],[c-r*.18,y-r*.4]],'#fff3e0');icoPoly(x,[[c+r*.7,y-r*.1],[c+r*.62,y-r*.8],[c+r*.18,y-r*.4]],'#fff3e0');icoPoly(x,[[c-r*.55,y-r*.2],[c+r*.55,y-r*.2],[c,y+r*.75]],'#fff3e0');icoDisc(x,c-r*.22,y-r*.02,r*.07,'#222');icoDisc(x,c+r*.22,y-r*.02,r*.07,'#222');icoDisc(x,c,y+r*.3,r*.1,'#222')};
ICON[3]=function(x,c,y,r){icoDisc(x,c,y,r,'#c2a633');icoDisc(x,c,y,r*.8,null,'#fff3a8',r*.07);icoText(x,'\u00d0',c,y+r*.04,r*1.25,'#fff')};
